name: ci

# Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
# controls the action repo can move v4 to different code, and every workflow
# that trusts the tag runs it. The trailing comment records which release the
# SHA is, and dependabot keeps both in step.
#
# upload-pages-artifact and deploy-pages move as a pair, in their own
# dependabot group, because it was their interaction that caused the artifact
# race fixed earlier -- a half-bump pairs one major with the other's previous
# one. They were held back while the pages job was failing on a GitHub-side
# 500, which would have made "my change broke it" indistinguishable from "the
# outage is ongoing"; that outage is over and the job is green on main again.
#
# Note that the pages job does not run on a pull request, so a bump of this
# pair cannot be validated before it lands. It is judged on the pages job of
# the merge commit, and reverted if that fails.

on:
  push:
    branches: [main, master]
    # Release tags publish the versioned GHCR image. Without this the
    # image job's semver tag rule and refs/tags/ push condition never
    # fire, because a `branches` filter excludes tag pushes.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ./scripts/lint.sh
      - name: Test
        run: pytest -q

  conformance:
    # Validates the published wire corpus against A-GRA 5.0a, and the
    # documented and implemented message sets against Table 1-38 of the
    # Vehicle Interface Volume, plus the per-interaction required-field
    # tables behind FEATURES' Execution column. Both standards are
    # fetched, not vendored, and pinned by digest -- the schema to the
    # same revision oa-gateway checks against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validate]"
      - name: Fetch A-GRA schema
        run: ./scripts/fetch-agra-schema.sh
      - name: Fetch A-GRA spec
        run: ./scripts/fetch-agra-spec.sh
      - name: Validate wire corpus
        run: pytest tests/test_wire_xsd.py -q
      - name: Check the message set against Table 1-38
        run: pytest tests/test_wire_surface.py -q
      - name: Check the interaction tables parse
        run: pytest tests/test_spec_interactions.py -q
      - name: Resolve interaction obligations against the schema
        run: pytest tests/test_spec_schema_paths.py -q
      - name: Check emitted fields against the interaction tables
        run: pytest tests/test_wire_required_fields.py -q
      - name: Check inbound required fields are read
        run: pytest tests/test_wire_inbound_fields.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
      # Browsable copy, for the runs that never deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: site
          retention-days: 14
      # The Pages artifact is uploaded here rather than in `pages` so a
      # job boundary separates the upload from the deployment. Doing
      # both back to back in one job races the artifact API:
      # deploy-pages queried metadata 1.2s after the upload began and
      # reported "No artifacts named github-pages-1", which failed the
      # merges of #4, #6 and #9 and left the published docs stale.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    # `docs` built the HTML and uploaded the Pages artifact. This job
    # only deploys it, so no artifact is written and read in the same
    # job. Private repos, fork PRs, and feature branches keep the
    # artifacts and skip the deployment.
    if: >-
      github.event_name == 'push'
      && !github.event.repository.private
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Both sides use the default artifact name, so there is nothing
      # to keep in sync between the upload and the deployment.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  image:
    # Build on every run. Push to GHCR only from a public default branch
    # or tag. Fork PRs keep the local build; they do not write the registry.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: >-
          github.event_name == 'push'
          && !github.event.repository.private
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name == 'push' && !github.event.repository.private && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


