<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="purpleLine" gradientUnits="userSpaceOnUse" x1="459" y1="190" x2="542" y2="190">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueLine" gradientUnits="userSpaceOnUse" x1="698" y1="170" x2="946" y2="170">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="#3b82f6"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)" opacity="0.3"/>

  <!-- ============ LEFT: TITLE BLOCK ============ -->
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" letter-spacing="1">
    <tspan fill="#38bdf8">Open</tspan><tspan fill="#f1f5f9">-VI</tspan>
  </text>
  <text x="62" y="182" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" letter-spacing="3.2" fill="#7dd3fc">OPEN VEHICLE INTERFACE</text>

  <line x1="62" y1="204" x2="380" y2="204" stroke="#1e3a5f" stroke-width="2"/>

  <text x="62" y="238" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94a3b8">One interface. Any vehicle.</text>

  <!-- github footer, small -->
  <g transform="translate(62,300)">
    <circle cx="13" cy="10" r="13" fill="#f1f5f9"/>
    <path fill="#0a1526" transform="translate(1,-2) scale(0.55)" d="M24 4c-11 0-20 9-20 20 0 8.8 5.7 16.3 13.7 19 1 .2 1.4-.4 1.4-1v-3.6c-5.6 1.2-6.8-2.4-6.8-2.4-.9-2.3-2.2-3-2.2-3-1.9-1.3.1-1.2.1-1.2 2 .1 3.1 2.1 3.1 2.1 1.8 3.1 4.7 2.2 5.9 1.7.2-1.3.7-2.2 1.3-2.7-4.5-.5-9.2-2.3-9.2-10 0-2.2.8-4 2.1-5.4-.2-.5-.9-2.6.2-5.4 0 0 1.7-.6 5.6 2a19.4 19.4 0 0 1 10.2 0c3.9-2.6 5.6-2 5.6-2 1.1 2.8.4 4.9.2 5.4 1.3 1.4 2.1 3.2 2.1 5.4 0 7.7-4.7 9.4-9.2 10 .7.6 1.4 1.9 1.4 3.8v5.6c0 .6.4 1.2 1.4 1C38.3 40.3 44 32.8 44 24c0-11-9-20-20-20z"/>
    <text x="32" y="15" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#7dd3fc">open-vi</text>
  </g>

  <!-- ============ DATA / C2 SOURCE (single, left of hex) ============ -->
  <g transform="translate(425,190)" filter="url(#glow)">
    <circle r="34" fill="#0a1526" stroke="#a78bfa" stroke-width="2.5"/>
  </g>
  <g transform="translate(425,190)" stroke="#c4b5fd" fill="none" stroke-linecap="round">
    <circle cx="0" cy="12" r="3.2" fill="#c4b5fd" stroke="none"/>
    <path d="M -8,3 A 11,11 0 0 1 8,3" stroke-width="2.4"/>
    <path d="M -14,-5 A 19,19 0 0 1 14,-5" stroke-width="2.4" opacity="0.65"/>
    <path d="M -20,-13 A 27,27 0 0 1 20,-13" stroke-width="2.4" opacity="0.35"/>
  </g>

  <!-- connecting line: data -> hex -->
  <path d="M 459,190 C 490,190 510,190 542,190" fill="none" stroke="url(#purpleLine)" stroke-width="2.2"/>
  <g fill="#ddd6fe">
    <circle r="3"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 459,190 C 490,190 510,190 542,190"/></circle>
  </g>

  <!-- connecting lines: hex -> vehicles -->
  <g stroke-width="2.2" fill="none">
    <path d="M 698,155 C 800,155 810,110 946,110" stroke="url(#blueLine)"/>
    <path d="M 698,190 C 850,190 900,190 946,190" stroke="url(#blueLine)"/>
    <path d="M 698,225 C 800,225 810,270 946,270" stroke="url(#greenLine)"/>
  </g>

  <g fill="#93c5fd">
    <circle r="3"><animateMotion dur="2s" repeatCount="indefinite" path="M 698,155 C 800,155 810,110 946,110"/></circle>
    <circle r="3"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite" path="M 698,190 C 850,190 900,190 946,190"/></circle>
  </g>
  <g fill="#6ee7b7">
    <circle r="3"><animateMotion dur="2s" begin="0.8s" repeatCount="indefinite" path="M 698,225 C 800,225 810,270 946,270"/></circle>
  </g>

  <!-- ============ CENTER: HEX CORE ============ -->
  <circle cx="620" cy="190" r="175" fill="url(#hexGlow)"/>
  <g filter="url(#glow)">
    <polygon points="620,104 698,147 698,233 620,276 542,233 542,147"
             fill="#0a1526" stroke="#38bdf8" stroke-width="3.5"/>
  </g>
  <g transform="translate(620,168) scale(0.5)" stroke="#38bdf8" stroke-width="3" fill="#38bdf8">
    <line x1="0" y1="0" x2="0" y2="-40" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="35" y2="20" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-35" y2="20" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-30" y2="-25" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="30" y2="-25" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="#e0f2fe" stroke="#38bdf8"/>
    <circle cx="0" cy="-40" r="6" stroke="none"/>
    <circle cx="35" cy="20" r="6" stroke="none"/>
    <circle cx="-35" cy="20" r="6" stroke="none"/>
    <circle cx="-30" cy="-25" r="6" stroke="none"/>
    <circle cx="30" cy="-25" r="6" stroke="none"/>
  </g>
  <text x="620" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#f8fafc">OPEN-VI</text>

  <!-- Drone node (top) -->
  <g transform="translate(980,110)" filter="url(#glow)">
    <circle r="34" fill="#0a1526" stroke="#38bdf8" stroke-width="2.5"/>
  </g>
  <g transform="translate(980,110)" stroke="#93c5fd" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="-13" y1="-13" x2="13" y2="13"/>
    <line x1="13" y1="-13" x2="-13" y2="13"/>
    <circle cx="-13" cy="-13" r="5.5"/>
    <circle cx="13" cy="-13" r="5.5"/>
    <circle cx="-13" cy="13" r="5.5"/>
    <circle cx="13" cy="13" r="5.5"/>
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#38bdf8" stroke="none"/>
  </g>

  <!-- Plane node (middle) -->
  <g transform="translate(980,190)" filter="url(#glow)">
    <circle r="34" fill="#0a1526" stroke="#38bdf8" stroke-width="2.5"/>
  </g>
  <g transform="translate(980,190) rotate(45)" fill="#93c5fd">
    <path d="M 0,-16 L 4,-5 L 17,2 L 17,6 L 4,4 L 5,15 L 10,19 L 10,21 L 0,18 L -10,21 L -10,19 L -5,15 L -4,4 L -17,6 L -17,2 L -4,-5 Z"/>
  </g>

  <!-- Boat node (bottom) - motorboat -->
  <g transform="translate(980,270)" filter="url(#glow)">
    <circle r="34" fill="#0a1526" stroke="#34d399" stroke-width="2.5"/>
  </g>
  <g transform="translate(980,270)" stroke="#6ee7b7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -17,9 L 17,9 L 12,18 L -12,18 Z"/>
    <path d="M -8,9 L -8,-3 L 9,-3 L 9,9 Z" fill="#34d399" fill-opacity="0.25"/>
    <line x1="2" y1="-3" x2="2" y2="-9"/>
  </g>
</svg>
