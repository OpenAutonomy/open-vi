# open-vi on the local ASB. Broker is compose/asb.yml.
#
#   docker compose -f compose/asb.yml -f compose/vi.yml up --build
#
# Stub on STOMP. The process is a client; it does not publish a port.
# PX4 is --platform px4 / VI_PLATFORM=px4 once a vehicle is reachable
# from this container (see docs/PX4.md).

services:
  open-vi:
    build:
      context: ..
      dockerfile: Containerfile
    image: open-vi:local
    container_name: open-vi
    environment:
      BROKER_HOST: activemq
      STOMP_PORT: "61613"
      VI_PLATFORM: stub
    depends_on:
      activemq:
        condition: service_healthy
    restart: unless-stopped
