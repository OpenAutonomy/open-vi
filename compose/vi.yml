# Stub on STOMP. Set BROKER_HOST to the ASB.
#
#   BROKER_HOST=host.docker.internal docker compose -f compose/vi.yml up --build
#
# PX4: VI_PLATFORM=px4 (see docs/PX4.md).

services:
  open-vi:
    build:
      context: ..
      dockerfile: Containerfile
    image: open-vi:local
    container_name: open-vi
    environment:
      BROKER_HOST: ${BROKER_HOST:-host.docker.internal}
      STOMP_PORT: ${STOMP_PORT:-61613}
      VI_PLATFORM: stub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
