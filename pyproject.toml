[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-vi"
version = "0.1.0"
description = "A-GRA ASK 5.0a Vehicle Interface (VI) — open-vi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "OpenAutonomy" },
]
dependencies = [
    "stomp.py>=8.1.0",
]

[project.optional-dependencies]
px4 = [
    "pymavlink>=2.4.41",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "pylint>=3.3",
    "pymavlink>=2.4.41",
]

[project.urls]
Homepage = "https://github.com/OpenAutonomy/open-vi"
Repository = "https://github.com/OpenAutonomy/open-vi"
Issues = "https://github.com/OpenAutonomy/open-vi/issues"

[project.scripts]
open-vi = "open_vi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_vi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/docs", "/compose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 30

# Formatter / fast checks aligned with Google Python Style (80 cols).
# Authoritative style lint: pylint + .pylintrc (Google styleguide).
[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
